name: Update Ramen Data

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC 기준)에 실행
  workflow_dispatch: # 버튼을 눌러 수동으로 실행할 수 있게 허용

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run crawler script
      run: python scripts/crawl_namu.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/ramen.json
        # 변경사항이 있을 때만 커밋
        git diff --quiet && git diff --staged --quiet || git commit -m "🍜 라면 데이터 자동 업데이트 (Namuwiki)"
        git push
